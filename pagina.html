<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      text-align: center;
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      max-width: 500px;
    }
    h1 {
      color: #333;
      font-size: 24px;
      margin-bottom: 10px;
    }
    p {
      color: #666;
      font-size: 16px;
      margin-bottom: 25px;
    }
    .btn {
      display: inline-block;
      background-color: #1a73e8;
      color: white;
      text-decoration: none;
      padding: 12px 30px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 16px;
      transition: background 0.2s;
    }
    .btn:hover {
      background-color: #1557b0;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Análise Completa Mounja Slim</h1>
    <p>Clique no botão abaixo para ler o artigo completo com todas as informações sobre valor, composição e se funciona mesmo.</p>
    <!-- O target="_top" é obrigatório para abrir o link corretamente por fora do script -->
    <a href="https://sites.google.com/view/mounja-slim-funciona-valor" target="_top" class="btn">Clique Aqui para Ler o Artigo</a>
  </div>

</body>
</html>
